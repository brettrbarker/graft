[package]
name = "robo-aft"
version = "1.0.0"
edition = "2021"
description = "A GUI tool for Robocopy on Windows 11 with hashing verification"
authors = ["Brett Barker"]

[dependencies]
# GUI framework
eframe = "0.29"
egui = "0.29"

# File dialogs
rfd = "0.15"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Serialization for saving/loading history
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Directory walking for hashing
walkdir = "2.5"

# Home directory
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "robo-aft"
path = "src/main.rs"
