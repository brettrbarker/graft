[package]
name = "graft"
version = "1.0.2"
edition = "2021"
description = "GRAFT - Graphical Robocopy Assured File Transfer Tool"
authors = ["Brett Barker"]

[dependencies]
# GUI framework
eframe = "0.33"
egui = "0.33"

# File dialogs
rfd = "0.17"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Serialization for saving/loading history
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Directory walking for hashing
walkdir = "2.5"

# Home directory
dirs = "6.0"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "graft"
path = "src/main.rs"
